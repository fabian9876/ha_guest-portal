set_alone_mode:
  name: Set alone mode
  description: Manually enable or disable alone-at-home mode.
  fields:
    enabled:
      required: true
      selector:
        boolean:

add_guest:
  name: Add guest
  description: Create a guest account. Passwords must be at least 12 characters. Only entity allowlists are exposed.
  fields:
    username:
      required: true
      selector:
        text:
    guest_id:
      required: false
      selector:
        text:
    password:
      required: true
      selector:
        text:
          type: password
    read_entities:
      required: false
      selector:
        entity:
          multiple: true
    write_entities:
      required: false
      selector:
        entity:
          multiple: true
    alone_entities:
      required: false
      description: Additional read entities available only while alone mode is active.
      selector:
        entity:
          multiple: true
    alone_write_entities:
      required: false
      description: Additional controllable entities available only while alone mode is active.
      selector:
        entity:
          multiple: true

remove_guest:
  name: Remove guest
  fields:
    guest_id:
      required: true
      selector:
        text:

set_guest_enabled:
  name: Enable or disable guest
  fields:
    guest_id:
      required: true
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:

approve_request:
  name: Approve login request
  description: Approve or reject a pending guest login request.
  fields:
    request_id:
      required: true
      selector:
        text:
    approved:
      required: true
      selector:
        boolean:

revoke_guest_sessions:
  name: Revoke guest sessions
  description: End every active session belonging to one guest. Requires an administrator.
  fields:
    guest_id:
      required: true
      selector:
        text:

revoke_all_sessions:
  name: Revoke all guest sessions
  description: Emergency action that ends every active Guest Portal session. Requires an administrator.
