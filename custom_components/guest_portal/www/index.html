<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><title>Gästeportal</title>
<style>
:root{color-scheme:dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#101827;color:#edf2f7;--panel:#1a2638;--line:#304057;--muted:#a9b7ca;--accent:#78a9ff;--good:#79d6a5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#243b5b 0,transparent 42%),#101827}
.wrap{width:min(1050px,100%);margin:auto;padding:clamp(18px,4vw,42px)}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:13px}.logo{width:46px;height:46px;border-radius:15px;background:#294b78;display:grid;place-items:center;font-size:24px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);margin:0}p{color:var(--muted);line-height:1.5}.sub{margin:5px 0 0}
.panel{background:#172337eF;border:1px solid var(--line);border-radius:22px;padding:clamp(18px,3vw,28px);box-shadow:0 18px 60px #0003}
label{display:block;color:var(--muted);font-size:.9rem;margin:14px 0 7px}input,button{font:inherit;border-radius:12px;padding:12px 14px}input{width:100%;border:1px solid var(--line);background:#101a2a;color:#fff}
button{border:1px solid #47658c;background:#284b78;color:#fff;cursor:pointer;font-weight:650}button:disabled{opacity:.5;cursor:wait}.secondary{background:transparent;border-color:var(--line);color:#d5e1f1}.danger{background:#512e3b;border-color:#754456}
.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1;min-width:90px}.hidden{display:none!important}
#message{min-height:24px;margin:12px 0;color:#c6d6eb}.statusbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:18px 0}
.pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:99px;background:#253a54;color:#dce9fb;font-size:.85rem}.dot{width:8px;height:8px;border-radius:50%;background:var(--good)}
.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.tools input{flex:1;min-width:190px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:13px}
.device{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:17px;min-width:0}
.device-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.device-name{font-weight:700;font-size:1rem;overflow-wrap:anywhere}.device-id{font-size:.76rem;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.state{font-size:1.35rem;font-weight:750;margin:18px 0 14px}.state small{font-size:.85rem;color:var(--muted);font-weight:500}
.empty{grid-column:1/-1;border:1px dashed #53647c;border-radius:16px;padding:28px;text-align:center;color:var(--muted)}
footer{margin-top:22px;text-align:right}
@media(max-width:520px){.wrap{padding:16px}.panel{border-radius:17px}header{align-items:flex-start}}
</style></head>
<body><div class="wrap">
<header><div class="brand"><div class="logo">⌂</div><div><h1>Willkommen</h1><p class="sub">Dein Zuhause auf einen Blick</p></div></div></header>
<main class="panel">
<p id="message" role="status">Bitte melde dich mit deinen Gast-Zugangsdaten an.</p>
<section id="login">
<label for="username">Benutzername</label><input id="username" autocomplete="username" maxlength="64">
<label for="password">Passwort</label><input id="password" type="password" autocomplete="current-password">
<button id="loginButton" style="width:100%;margin-top:18px">Anmelden</button>
<div id="otpBox" class="hidden"><label for="otp">Einmalcode</label><input id="otp" inputmode="numeric" maxlength="6"><button id="otpButton" style="width:100%;margin-top:10px">Code bestätigen</button></div>
</section>
<section id="portal" class="hidden">
<div class="statusbar"><span id="mode" class="pill"></span><span id="count" class="pill"></span></div>
<div class="tools"><input id="filter" type="search" placeholder="Gerät suchen …" aria-label="Geräte suchen"></div>
<div id="entities" class="grid" style="margin-top:16px"></div>
<footer><button id="logout" class="secondary">Abmelden</button></footer>
</section>
</main></div>
<script>
(() => {
 const base="/api/guest_portal";let token=sessionStorage.getItem("guest_portal_token"),challenge=null,approval=null,poll=null,allEntities=[];
 const $=id=>document.getElementById(id),message=t=>$("message").textContent=t;
 const api=async(path,options={})=>{const headers={"Content-Type":"application/json",...(token?{Authorization:"Bearer "+token}:{}),...(options.headers||{})};const r=await fetch(base+path,{...options,headers});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||"Anfrage fehlgeschlagen");return d};
 const domainIcon=id=>({light:"💡",switch:"🔌",fan:"🌀",climate:"🌡️",cover:"🪟",sensor:"📊",binary_sensor:"◉",media_player:"♫"}[id.split(".")[0]]||"⌂");
 const render=()=>{const query=$("filter").value.trim().toLocaleLowerCase("de");const list=allEntities.filter(e=>(e.name+" "+e.entity_id).toLocaleLowerCase("de").includes(query));$("entities").replaceChildren();$("count").textContent=list.length+" von "+allEntities.length+" Geräten";
 if(!list.length){const empty=document.createElement("div");empty.className="empty";empty.textContent=allEntities.length?"Keine passenden Geräte gefunden.":"Für deinen Zugang sind aktuell keine Geräte freigegeben."; $("entities").append(empty);return}
 for(const e of list){const card=document.createElement("article");card.className="device";const top=document.createElement("div");top.className="device-top";const name=document.createElement("div");const title=document.createElement("div");title.className="device-name";title.textContent=e.name;const id=document.createElement("div");id.className="device-id";id.textContent=e.entity_id;name.append(title,id);const icon=document.createElement("span");icon.textContent=domainIcon(e.entity_id);icon.style.fontSize="1.5rem";top.append(name,icon);card.append(top);
 const state=document.createElement("div");state.className="state";state.textContent=e.state+(e.unit?" ":"");if(e.unit){const unit=document.createElement("small");unit.textContent=e.unit;state.append(unit)}card.append(state);
 if(e.can_control&&["light","switch","fan","homeassistant"].includes(e.entity_id.split(".")[0])){const actions=document.createElement("div");actions.className="actions";const toggle=document.createElement("button");toggle.textContent=["on","open","playing","heat","cool"].includes(e.state.toLowerCase())?"Ausschalten":"Einschalten";toggle.addEventListener("click",async()=>{toggle.disabled=true;try{await api("/control",{method:"POST",body:JSON.stringify({entity_id:e.entity_id,service:"toggle"})});await showPortal()}catch(err){message(err.message);toggle.disabled=false}});actions.append(toggle);card.append(actions)}
 $("entities").append(card)}
 };
 const showPortal=async()=>{$("login").classList.add("hidden");$("portal").classList.remove("hidden");const d=await api("/states");allEntities=d.entities;$("mode").textContent=d.alone_mode?"● Allein-Modus aktiv":"● Normaler Gastzugriff";render();message("Deine freigegebenen Geräte.");};
 const beginPoll=()=>{clearInterval(poll);let count=0;poll=setInterval(async()=>{if(++count>120){clearInterval(poll);message("Freigabe abgelaufen. Bitte erneut anmelden.");return}try{const d=await api("/approval/"+encodeURIComponent(approval));if(d.status==="approved"){clearInterval(poll);token=d.token;sessionStorage.setItem("guest_portal_token",token);await showPortal()}else if(d.status==="rejected"){clearInterval(poll);message("Anmeldung wurde abgelehnt.")}}catch(e){clearInterval(poll);message(e.message)}},3000)};
 $("loginButton").addEventListener("click",async()=>{try{const d=await api("/login",{method:"POST",body:JSON.stringify({username:$("username").value,password:$("password").value})});if(d.status==="otp_required"){challenge=d.challenge_id;$("otpBox").classList.remove("hidden");message("Einmalcode wurde versendet.")}else if(d.status==="approval_required"){approval=d.request_id;message("Warte auf Freigabe durch den Administrator.");beginPoll()}}catch(e){message(e.message)}});
 $("otpButton").addEventListener("click",async()=>{try{const d=await api("/login",{method:"POST",body:JSON.stringify({challenge_id:challenge,otp:$("otp").value})});token=d.token;sessionStorage.setItem("guest_portal_token",token);await showPortal()}catch(e){message(e.message)}});
 $("filter").addEventListener("input",render);
 $("logout").addEventListener("click",async()=>{try{await api("/logout",{method:"POST"})}catch(e){}token=null;sessionStorage.removeItem("guest_portal_token");$("portal").classList.add("hidden");$("login").classList.remove("hidden");message("Du wurdest abgemeldet.")});
 if(token)showPortal().catch(()=>{token=null;sessionStorage.removeItem("guest_portal_token")});
})();
</script></body></html>
